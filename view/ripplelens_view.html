function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function init(){
  var sel=$("commit"); sel.innerHTML="";
  DATA.forEach(function(d,i){var o=document.createElement("option");o.value=i;o.textContent=d.repo+" "+d.sha+": "+d.subject.slice(0,50);sel.appendChild(o)});
  sel.onchange=function(){state.c=+sel.value;state.reveal=false;render()};
  var names=Object.keys(DATA[0].methods), mb=$("mbtns"); mb.innerHTML="";
  names.forEach(function(n){var b=document.createElement("button");b.textContent=n;b.setAttribute("data-m",n);b.onclick=function(){state.m=n;render()};mb.appendChild(b)});
  $("reveal").onclick=function(){state.reveal=!state.reveal;render()};
  render();
}
function render(){
  var d=DATA[state.c], list=d.methods[state.m], truth=d.truth, cx=330, cy=250, i;
  Array.prototype.forEach.call($("mbtns").children,function(b){b.className=b.getAttribute("data-m")===state.m?"on":""});
  $("reveal").textContent=state.reveal?"Hide truth":"Reveal truth";
  var s='<svg id="ripple" viewBox="0 0 660 500" role="img" aria-label="Ripple diagram"><circle cx="'+cx+'" cy="'+cy+'" r="120" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/><circle cx="'+cx+'" cy="'+cy+'" r="195" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>';
  var pos=list.map(function(p,k){var inner=k<5, n=inner?5:5, idx=inner?k:k-5, a=(idx/n)*2*Math.PI+(inner?-Math.PI/2:-Math.PI/2+0.3), r=inner?120:195;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a),p:p,k:k}});
  pos.forEach(function(q){s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q.x.toFixed(1)+'" y2="'+q.y.toFixed(1)+'" stroke="var(--line)" stroke-opacity="'+(1-q.k*0.07).toFixed(2)+'"/>'});
  var hits=0;
  pos.forEach(function(q){
    var isT=truth.indexOf(q.p)>=0; if(isT)hits++;
    var fill="var(--node)", stroke="none";
    if(state.reveal){fill=isT?"var(--hit)":"var(--node)"; if(!isT)stroke="var(--miss)"}
    s+='<circle class="node" data-hit="'+(isT?1:0)+'" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="9" fill="'+fill+'" stroke="'+(stroke==="none"?"none":stroke)+'" stroke-width="2"><title>'+esc(q.p)+'</title></circle>';
    var right=q.x>=cx; s+='<text x="'+(q.x+(right?13:-13)).toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="'+(right?"start":"end")+'">'+(q.k+1)+". "+esc(base(q.p))+'</text>';
  });
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="var(--seed)"><title>'+esc(d.seed)+'</title></circle><text x="'+cx+'" y="'+(cy+32)+'" text-anchor="middle" style="font-weight:600">seed: '+esc(base(d.seed))+'</text></svg>';
  $("svgbox").innerHTML=s;
  var missed=truth.filter(function(t){return list.indexOf(t)<0});
  var h='<div><b>'+esc(d.repo)+'</b> '+esc(d.sha)+' <span class="lbl">'+esc(d.date)+'</span></div><div>'+esc(d.subject)+'</div><div style="margin-top:6px"><span class="pill">'+esc(state.m)+'</span> top-10 predictions</div>';
  if(state.reveal){h+='<div style="margin-top:6px"><b>'+hits+' of '+truth.length+'</b> truly changed files in the top 10 (recall@10 = '+(hits/truth.length).toFixed(2)+')</div>';
    if(missed.length){h+='<div style="margin-top:4px">Changed but not predicted:</div><ul>'+missed.map(function(m){return '<li>'+esc(m)+'</li>'}).join("")+'</ul>'}}
  else{h+='<div style="margin-top:6px" class="lbl">Truth is hidden. Click &ldquo;Reveal truth&rdquo; to see which predicted files the developers really changed.</div>'}
  $("panel").innerHTML=h;
}
init();
</script></body></html>
